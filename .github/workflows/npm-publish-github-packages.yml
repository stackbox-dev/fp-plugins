# Publishes to GitHub Packages when a release is published.
# See .claude/skills/release/SKILL.md for the release procedure.

name: Node.js Package

on:
  release:
    # published, not created: GitHub fires `created` when a *draft* is saved, which
    # would publish from the default branch before the tag exists — and then fires
    # `published` (not `created`) when that draft is released, so the real release
    # would ship nothing.
    types: [published]

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
      - run: pnpm install --frozen-lockfile

      # The release tag and package.json must agree, or the published version silently
      # differs from the tag people will go looking for. TAG comes through env rather
      # than being interpolated into the script.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json $VERSION" >&2
            exit 1
          fi

      # npm publish, not pnpm publish: pnpm adds git-state checks the release flow
      # does not need. prepublishOnly runs the build either way.
      # No --provenance: GitHub Packages does not accept provenance attestations.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
