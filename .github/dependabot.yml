version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps review manageable; majors stay separate so a
      # breaking change is never bundled with routine patches.
      aws-sdk:
        patterns: ["@aws-sdk/*"]
        update-types: ["minor", "patch"]
      azure-sdk:
        patterns: ["@azure/*"]
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
