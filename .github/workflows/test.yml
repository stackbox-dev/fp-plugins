name: Run Tests

on:
  # No branch filter: a stacked PR based on another feature branch must still run
  # tests. With a filter, such PRs report no checks at all — and a required status
  # check that never reports counts as pending, blocking the merge forever.
  pull_request:

env:
  NODE_VERSION: 24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
